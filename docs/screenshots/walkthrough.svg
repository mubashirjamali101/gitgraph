<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .sidebar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .card { fill: #21262d; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #c9d1d9; font-weight: 600; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #58a6ff; }
      .badge-branch { fill: #1f6beb; rx: 4px; }
      .badge-tag { fill: #238636; rx: 4px; }
      .dot-main { fill: #58a6ff; }
      .dot-feature { fill: #3fb950; }
      .dot-stash { fill: #d29922; }
      .line-main { stroke: #58a6ff; stroke-width: 2.5; stroke-linecap: round; }
      .line-feature { stroke: #3fb950; stroke-width: 2.5; stroke-linecap: round; }
      
      /* Animation keyframes */
      @keyframes pulseStep {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes highlightRow {
        0%, 100% { fill: #21262d; }
        25% { fill: #1f6beb33; }
        50% { fill: #23863633; }
        75% { fill: #a371f733; }
      }
      .step-1 { animation: pulseStep 4s infinite ease-in-out; }
      .active-row { animation: highlightRow 6s infinite ease-in-out; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="675" rx="8" />

  <!-- App Header -->
  <rect class="header" x="0" y="0" width="1200" height="42" />
  <circle cx="20" cy="21" r="6" fill="#ff5f56" />
  <circle cx="40" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="6" fill="#27c93f" />
  <text x="540" y="26" class="text-title" text-anchor="middle">GitGraph — GitGraph (mubashirjamali101/gitgraph)</text>

  <!-- Sidebar -->
  <rect class="sidebar" x="0" y="42" width="260" height="633" />
  <text x="20" y="72" class="text-title">REPOSITORIES</text>
  
  <rect x="12" y="86" width="236" height="34" rx="6" fill="#1f6beb22" stroke="#1f6beb" stroke-width="1"/>
  <text x="32" y="108" class="text-title">gitgraph</text>
  <text x="210" y="108" class="text-sub">main</text>

  <!-- Uncommitted Changes Section -->
  <text x="20" y="155" class="text-title">CHANGES (3)</text>
  <rect x="12" y="170" width="236" height="120" class="card" />
  <text x="24" y="194" class="text-sub" fill="#3fb950">+ src/store.ts</text>
  <text x="24" y="218" class="text-sub" fill="#3fb950">+ src/App.tsx</text>
  <text x="24" y="242" class="text-sub" fill="#d29922">~ src/persist.ts</text>
  
  <!-- Commit Box -->
  <rect x="12" y="300" width="236" height="70" class="card" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="325" class="text-sub">feat: support system appearance</text>
  <rect x="150" y="342" width="88" height="22" rx="4" fill="#238636"/>
  <text x="194" y="357" class="text-title" fill="#ffffff" text-anchor="middle" font-size="11">Commit</text>

  <!-- Main Graph Area -->
  <!-- Toolbar -->
  <rect class="header" x="260" y="42" width="940" height="42" />
  <rect x="275" y="51" width="120" height="24" rx="4" fill="#21262d" stroke="#30363d" />
  <text x="335" y="67" class="text-sub" text-anchor="middle">Branch: All</text>
  
  <rect x="405" y="51" width="180" height="24" rx="4" fill="#21262d" stroke="#30363d" />
  <text x="495" y="67" class="text-sub" text-anchor="middle">🔍 Search commits (/)...</text>
  
  <rect x="1080" y="51" width="100" height="24" rx="4" fill="#1f6beb" />
  <text x="1130" y="67" class="text-title" fill="#ffffff" text-anchor="middle" font-size="11">Fetch / Pull</text>

  <!-- Graph Rows -->
  <!-- Working Tree Row -->
  <rect class="active-row" x="270" y="96" width="915" height="44" rx="6"/>
  <circle cx="310" cy="118" r="7" fill="#d29922" />
  <text x="340" y="122" class="text-title" fill="#d29922">Uncommitted Changes (3 files staged/unstaged)</text>
  <text x="1060" y="122" class="text-sub">Working Tree</text>

  <!-- Commit 1 (HEAD / main) -->
  <line class="line-main" x1="310" y1="118" x2="310" y2="172" />
  <circle cx="310" cy="172" r="6" class="dot-main" />
  <rect class="badge-branch" x="330" y="160" width="85" height="22"/>
  <text x="372" y="175" class="text-title" fill="#ffffff" text-anchor="middle" font-size="11">main (HEAD)</text>
  <rect class="badge-tag" x="422" y="160" width="55" height="22"/>
  <text x="449" y="175" class="text-title" fill="#ffffff" text-anchor="middle" font-size="11">v0.1.3</text>
  <text x="490" y="176" class="text-title">release: v0.1.3 cross-platform stability fixes</text>
  <text x="1060" y="176" class="text-sub">Mubashir Jamali</text>

  <!-- Commit 2 (Feature branch merge) -->
  <line class="line-main" x1="310" y1="172" x2="310" y2="226" />
  <line class="line-feature" x1="310" y1="172" x2="340" y2="226" />
  <circle cx="310" cy="226" r="6" class="dot-main" />
  <circle cx="340" cy="226" r="6" class="dot-feature" />
  <text x="360" y="230" class="text-title">feat: add right click options to file editor tabs</text>
  <text x="1060" y="230" class="text-sub">Mubashir Jamali</text>

  <!-- Commit 3 -->
  <line class="line-main" x1="310" y1="226" x2="310" y2="280" />
  <line class="line-feature" x1="340" y1="226" x2="310" y2="280" />
  <circle cx="310" cy="280" r="6" class="dot-main" />
  <text x="340" y="284" class="text-title">fix(safe_cmd): execute git hooks and fix path resolution</text>
  <text x="1060" y="284" class="text-sub">Mubashir Jamali</text>

  <!-- Commit 4 -->
  <line class="line-main" x1="310" y1="280" x2="310" y2="334" />
  <circle cx="310" cy="334" r="6" class="dot-main" />
  <text x="340" y="338" class="text-title">feat(windows): add CREATE_NO_WINDOW background process flag</text>
  <text x="1060" y="338" class="text-sub">Mubashir Jamali</text>

  <!-- Expanded Detail Panel for Selected Commit -->
  <rect x="270" y="360" width="915" height="295" class="card" filter="url(#shadow)" stroke="#30363d" stroke-width="1"/>
  <rect x="270" y="360" width="915" height="36" fill="#161b22" rx="6"/>
  <text x="290" y="383" class="text-title">Commit 51d4bab — release: v0.1.3 cross-platform stability fixes</text>
  
  <text x="290" y="420" class="text-sub">Author: Mubashir Jamali &lt;mubashirjamali101@gmail.com&gt;</text>
  <text x="290" y="440" class="text-sub">Date: Wed Aug 26 2026 15:38:12 GMT+0500</text>
  
  <!-- Changed Files List -->
  <text x="290" y="475" class="text-title">FILES CHANGED (4)</text>
  <rect x="290" y="490" width="300" height="145" fill="#161b22" rx="4"/>
  <text x="305" y="515" class="text-code">M  src-tauri/src/safe_cmd.rs</text>
  <text x="305" y="540" class="text-code">M  src-tauri/src/main.rs</text>
  <text x="305" y="565" class="text-code">M  src/App.tsx</text>
  <text x="305" y="590" class="text-code">M  src/components/graph/EditorTabBar.tsx</text>

  <!-- Diff Preview -->
  <rect x="610" y="490" width="555" height="145" fill="#161b22" rx="4"/>
  <text x="625" y="515" class="text-code" fill="#8b949e">@@ -55,6 +55,12 @@ fn configured_git(...) {</text>
  <text x="625" y="540" class="text-code" fill="#7ee787">+    #[cfg(windows)]</text>
  <text x="625" y="565" class="text-code" fill="#7ee787">+    cmd.creation_flags(0x08000000); // CREATE_NO_WINDOW</text>
  <text x="625" y="590" class="text-code" fill="#7ee787">+    cmd.arg("-c").arg("core.quotepath=false");</text>
</svg>
